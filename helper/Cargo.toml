[package]
name = "apo-helper"
version = "1.0.0"
edition = "2021"
publish = false
description = "Reads and writes Equalizer APO's configuration for the NADI equalizer plugin."
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
